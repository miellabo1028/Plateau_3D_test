<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>PLATEAU 3D Tiles - MapLibre + deck.gl (OSS)</title>
  
  <!-- 1. 完全OSSの地図ライブラリ MapLibre GL JS のスタイルとスクリプト -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <!-- 2. deck.gl の本体スクリプト（loaders.gl等のコア機能内蔵版） -->
  <script src="https://unpkg.com/@loaders.gl/core@[バージョン]/dist/dist.min.js"></script>

  <style>
    body { margin: 0; padding: 0; overflow: hidden; }
    #map { width: 100vw; height: 100vh; position: absolute; top: 0; bottom: 0; }
  </style>
</head>
<body>

  <!-- 地図を描画するコンテナ -->
  <div id="map"></div>

  <script>
    // --- 3. MapLibre GL JS (ベースマップ) の初期化 ---
    // OSSの国土地理院ベクトルタイル等を使うと完全無料ですが、今回は手軽さ優先でオープンデータ（Positron）を使用
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://cartocdn.com', // シンプルな背景
      center: [139.756, 35.683], // 東京都千代田区付近
      zoom: 16,
      pitch: 50,    // 地図を傾ける（3D表示）
      bearing: 10,  // 地図の回転
      antialias: true
    });

    // --- 4. map.on('load') 内で deck.gl レイヤーを組み込む ---
    map.on('load', () => {
      
      // 国交省 PLATEAU 配信サービスが提供する、全国一括の3D Tilesエンドポイント (LOD1 / テクスチャなし)
      // 試験運用中のため、必要に応じて都市別URL（tileset.json）に差し替えてください
      const PLATEAU_3D_TILES_URL = 'https://api.plateauview.mlit.go.jp/datacatalog/3dtiles/all-bldg-lod1-2025/tileset.json';

      // MapLibreの上に deck.gl のレイヤーを「重ね合わせ（インターリーブ）」する設定
      const plateauLayer = new deck.MapboxLayer({
        id: 'plateau-3d-tiles',
        type: deck.Tile3DLayer, // 3D Tilesを描画する専用クラス
        data: PLATEAU_3D_TILES_URL,
        loader: deck.Tiles3DLoader, // loaders.gl の 3D Tiles 読み込みエンジン
        
        // ★ ネットワークが弱い現場（低帯域）向けの爆速・超軽量チューニング
        loadOptions: {
          '3d-tiles': {
            maximumScreenSpaceError: 24, // 16(標準)から24へ。遠くの建物を粗くして通信量を劇的に削減
            maximumMemoryUsage: 128     // メモリ上のキャッシュを制限し、ブラウザのクラッシュを防ぐ（MB単位）
          }
        },
        
        // 建物の色（RGBA）を設定。ここでは半透明のスタイリッシュなブルー
        _getLighting: 'pbr',
        getColor: [70, 130, 180, 200] 
      });

      // MapLibre のベース地図レイヤーとして deck.gl を追加
      map.addLayer(plateauLayer);
    });
  </script>
</body>
</html>
